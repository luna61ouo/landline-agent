[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "landline-agent"
version = "0.0.1"
description = "Let an AI place phone calls through your own landline, with human approval built in."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "google-genai>=1.0",
  "audioop-lts; python_version >= '3.13'",
]

[project.scripts]
landline-agent = "landline_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["landline_agent*"]

[tool.setuptools.package-data]
landline_agent = ["prompts/*/*.md", "policies/*/*.md"]
